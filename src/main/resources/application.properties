spring.application.name=classtrack

server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classtrack}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET:classtrack-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.session.duration-minutes=${SESSION_DURATION_MINUTES:15}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
